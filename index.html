<style>
:root{color-scheme:dark;--txt:#f4f6ff;--muted:#a6b2ce;--line:rgba(255,255,255,.15);--glass:rgba(16,22,37,.78);--panel:rgba(12,19,34,.92);--accent:#81aaff;--wall:radial-gradient(ellipse at 15% 15%,#324b88 0%,transparent 40%),radial-gradient(ellipse at 85% 65%,#3c2475 0%,transparent 46%),linear-gradient(135deg,#0a1733,#070b16 70%);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",Inter,system-ui,sans-serif}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#090f20;color:var(--txt);-webkit-tap-highlight-color:transparent}button,input,textarea,select{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}button{color:inherit}#desktop{position:fixed;inset:0;background:var(--wall);overflow:hidden}#desktop::after{content:"";pointer-events:none;position:absolute;inset:0;background:radial-gradient(circle at 50% 0%,rgba(255,255,255,.1),transparent 45%)}#topbar{position:absolute;z-index:500;top:0;left:0;right:0;height:39px;padding:0 max(14px,env(safe-area-inset-right)) 0 max(14px,env(safe-area-inset-left));display:flex;align-items:center;justify-content:space-between;background:rgba(5,10,22,.51);backdrop-filter:blur(28px);border-bottom:1px solid rgba(255,255,255,.1);font-size:12px;font-weight:600}#topbar .left,#topbar .right{display:flex;align-items:center;gap:13px}#topbar button{border:0;background:none;padding:5px 2px;font-weight:700}.logo{font-size:15px;letter-spacing:-1px;color:#fff}.dot{color:#78aaff}#clock{font-variant-numeric:tabular-nums}#workspace{position:absolute;inset:40px 0 0;z-index:2}#shortcuts{position:absolute;top:24px;left:15px;display:grid;grid-auto-flow:column;grid-template-rows:repeat(5,86px);gap:12px;align-content:start}.shortcut{width:80px;border:1px solid transparent;background:transparent;border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;text-shadow:0 1px 5px #000;user-select:none}.shortcut:active,.shortcut:hover{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.2)}.shortcut .sicon{width:48px;height:48px;display:grid;place-items:center;font-size:29px;border:1px solid rgba(255,255,255,.26);border-radius:15px;background:linear-gradient(145deg,rgba(255,255,255,.24),rgba(255,255,255,.07));box-shadow:0 8px 24px #0004}.shortcut span:last-child{font-size:11px;font-weight:600}#dock{position:absolute;z-index:600;bottom:calc(13px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:7px;padding:8px 11px;border:1px solid rgba(255,255,255,.23);border-radius:22px;background:rgba(18,25,43,.66);backdrop-filter:blur(24px);box-shadow:0 12px 45px #0008;max-width:calc(100% - 12px)}.dock-btn{flex:none;position:relative;width:47px;height:47px;border:1px solid rgba(255,255,255,.2);border-radius:14px;background:rgba(255,255,255,.13);display:grid;place-items:center;font-size:25px}.dock-btn:hover,.dock-btn:focus{background:rgba(255,255,255,.26)}.dock-btn.running::after{position:absolute;content:"";width:5px;height:5px;background:white;bottom:-6px;border-radius:50%}#windows{position:absolute;inset:0;pointer-events:none}.window{position:absolute;display:flex;flex-direction:column;min-width:265px;min-height:220px;width:560px;height:400px;border:1px solid rgba(255,255,255,.23);border-radius:15px;background:var(--panel);backdrop-filter:blur(35px);box-shadow:0 25px 90px #000b;overflow:hidden;pointer-events:auto;animation:appear .14s ease-out;transform:translateZ(0)}@keyframes appear{from{opacity:0;scale:.97}to{opacity:1;scale:1}}.window.active{border-color:rgba(180,205,255,.55)}.titlebar{height:43px;flex:none;display:flex;align-items:center;padding:0 12px;gap:12px;background:rgba(255,255,255,.065);border-bottom:1px solid var(--line);touch-action:none;user-select:none}.traffic{display:flex;gap:7px}.traffic button{width:13px;height:13px;border-radius:50%;border:0;padding:0}.close{background:#ff6660}.min{background:#ffc04b}.max{background:#4dcc76}.windowtitle{font-size:12px;color:#e1e8ff;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.windowcontent{flex:1;min-height:0;overflow:auto;overscroll-behavior:contain}.resize{position:absolute;right:0;bottom:0;width:27px;height:27px;cursor:nwse-resize;touch-action:none;background:linear-gradient(135deg,transparent 58%,rgba(255,255,255,.2) 59%,rgba(255,255,255,.2) 63%,transparent 64%,transparent 75%,rgba(255,255,255,.2) 76%,rgba(255,255,255,.2) 81%,transparent 82%)}.panel{padding:19px}.muted{color:var(--muted)}.sub{font-size:12px}.heading{font-size:21px;margin:0 0 7px}.tilegrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(100px,1fr));gap:10px;margin-top:15px}.tile{padding:15px 8px;display:flex;flex-direction:column;align-items:center;gap:7px;background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:12px;font-size:12px}.tile .emoji{font-size:27px}.toolbar{display:flex;align-items:center;gap:8px;padding:11px;border-bottom:1px solid var(--line);flex-wrap:wrap}input,textarea,select{background:rgba(255,255,255,.07);color:var(--txt);border:1px solid var(--line);border-radius:9px;padding:9px 11px;min-width:0}textarea{resize:none}select option{background:#19223a}.btn{border-radius:9px;border:1px solid var(--line);background:rgba(255,255,255,.09);padding:9px 12px;font-size:12px;font-weight:650}.btn:hover{background:rgba(255,255,255,.17)}.btn.primary{background:#426ac4;border-color:#668ce0}.file-row{display:flex;gap:10px;align-items:center;padding:12px 14px;border-bottom:1px solid rgba(255,255,255,.07);font-size:13px}.file-row .name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}.file-row button{padding:5px 8px}.notes-area{width:100%;height:100%;min-height:180px;border:0;border-radius:0;background:transparent;padding:20px;font-size:15px;line-height:1.55;outline:none}.calc{padding:17px;max-width:340px;margin:auto}.calc-display{text-align:right;font-size:34px;padding:20px 6px;overflow:hidden;white-space:nowrap}.calc-buttons{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.calc-buttons button{border:1px solid var(--line);border-radius:11px;background:rgba(255,255,255,.1);padding:14px 0;font-size:17px}.calc-buttons button.op{background:#294c91}.terminal{background:#070c17;color:#b1eac8;padding:14px;font:13px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;height:100%;display:flex;flex-direction:column}.term-output{flex:1;white-space:pre-wrap;overflow-y:auto;overflow-wrap:anywhere}.term-line{display:flex;align-items:center;gap:8px}.term-input{flex:1;border:0;padding:8px 0;background:none;color:#fff;font:inherit;outline:none}.swatches{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:12px}.swatch{height:64px;border-radius:12px;border:2px solid transparent}.swatch.selected{border-color:white}.info{line-height:1.55;font-size:13px}.bigtime{font-size:46px;font-weight:750;letter-spacing:-2px}.startmenu{position:absolute;z-index:700;top:44px;left:12px;width:min(340px,calc(100vw - 24px));padding:13px;background:rgba(16,23,40,.97);border:1px solid var(--line);border-radius:15px;box-shadow:0 18px 55px #000b;display:none}.startmenu.open{display:block}.startitem{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:10px;border:0;border-radius:10px;background:none;font-size:13px}.startitem:hover{background:#ffffff20}.toast{position:absolute;bottom:94px;left:50%;transform:translateX(-50%);background:#1e304f;border:1px solid #88aaff55;color:#fff;border-radius:10px;padding:10px 15px;z-index:900;max-width:90%;font-size:12px;box-shadow:0 10px 30px #0009;display:none;text-align:center}#context{position:absolute;z-index:750;display:none;background:#172239;border:1px solid var(--line);border-radius:10px;padding:6px;box-shadow:0 12px 30px #0009}#context button{display:block;width:100%;border:0;text-align:left;background:none;padding:9px 14px;border-radius:6px;font-size:12px}#context button:hover{background:#ffffff24}.file-empty{text-align:center;padding:36px 15px;font-size:13px;color:var(--muted)}.editor{display:flex;flex-direction:column;height:100%}.editor textarea{flex:1;border:0;border-radius:0;width:100%;padding:16px;background:transparent;outline:0}.hint{font-size:11px;color:var(--muted)}@media(max-width:650px){#topbar{height:42px}#workspace{top:42px}#shortcuts{grid-template-rows:repeat(5,79px);gap:6px;top:17px;left:7px}.shortcut{width:70px}.shortcut .sicon{width:44px;height:44px;font-size:26px}.window{min-width:0;min-height:180px;border-radius:13px}#dock{gap:5px;padding:7px 8px;border-radius:17px}.dock-btn{width:43px;height:43px;font-size:23px}.titlebar{height:45px}.resize{width:28px;height:28px}}@media(max-height:500px){#dock{bottom:calc(4px + env(safe-area-inset-bottom))}.dock-btn{height:37px;width:37px;font-size:19px}#shortcuts{grid-template-rows:repeat(3,74px)}}
</style>

<body>
<div id="desktop"><div id="topbar"><div class="left"><button id="start" aria-label="Abrir menu KG"><span class="logo">KG<span class="dot">●</span></span></button><span id="activeLabel">Desktop</span></div><div class="right"><span id="connection">◉ Local</span><span id="clock"></span></div></div><div id="workspace"><div id="shortcuts"></div><div id="windows"></div></div><div id="dock"></div><div id="startmenu" class="startmenu"></div><div id="context"></div><div id="toast" class="toast" role="status"></div></div>
<script>
(()=>{'use strict';
const $=s=>document.querySelector(s), dom={desktop:$('#desktop'),windows:$('#windows'),shortcuts:$('#shortcuts'),dock:$('#dock'),menu:$('#startmenu'),context:$('#context'),toast:$('#toast')};
const apps=[{id:'files',icon:'📁',name:'Arquivos'},{id:'notes',icon:'📝',name:'Notas'},{id:'editor',icon:'📄',name:'Editor'},{id:'terminal',icon:'⌨️',name:'Terminal'},{id:'calculator',icon:'🧮',name:'Calculadora'},{id:'browser',icon:'🌐',name:'Web'},{id:'settings',icon:'⚙️',name:'Ajustes'},{id:'about',icon:'💻',name:'Sobre'}];
const themes=[{name:'Aurora',css:'radial-gradient(ellipse at 15% 15%,#324b88 0%,transparent 40%),radial-gradient(ellipse at 85% 65%,#3c2475 0%,transparent 46%),linear-gradient(135deg,#0a1733,#070b16 70%)'},{name:'Oceano',css:'radial-gradient(circle at 70% 15%,#146f9e,transparent 47%),linear-gradient(145deg,#051e33,#060f1d)'},{name:'Pôr do sol',css:'radial-gradient(ellipse at 70% 20%,#db597a,transparent 47%),linear-gradient(135deg,#42205c,#10102b)'},{name:'Floresta',css:'radial-gradient(circle at 75% 10%,#217c64,transparent 48%),linear-gradient(135deg,#133c3f,#07151a)'},{name:'Grafite',css:'linear-gradient(130deg,#313745,#101520 60%,#060a12)'},{name:'Violeta',css:'radial-gradient(circle at 25% 40%,#7044c0,transparent 50%),linear-gradient(120deg,#151038,#07091e)'}];
const store={get(k,def){try{let s=localStorage.getItem('kgd_'+k);return s===null?def:JSON.parse(s)}catch{return def}},set(k,v){try{localStorage.setItem('kgd_'+k,JSON.stringify(v));return true}catch{toast('Armazenamento local indisponível ou cheio.');return false}}};
let files=store.get('files',[{name:'Bem-vindo.txt',content:'Bem-vindo ao KG Desktop!\n\nUse o gerenciador Arquivos para criar e editar textos.\nAs informações ficam no armazenamento local do navegador.\n\nDica: Ctrl/Cmd + K abre o menu e Esc o fecha.'}]);
let notes=store.get('notes','Minhas notas no KG Desktop...');let theme=store.get('theme',0);if(!Number.isInteger(theme)||theme<0||theme>=themes.length)theme=0;applyTheme();
const windows=new Map();let counter=0,z=20,lastFocus='';const safe=(s)=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let toastTimer;function toast(s){dom.toast.textContent=s;dom.toast.style.display='block';clearTimeout(toastTimer);toastTimer=setTimeout(()=>dom.toast.style.display='none',3200)}
function applyTheme(){document.documentElement.style.setProperty('--wall',themes[theme].css)}
function closeMenu(){dom.menu.classList.remove('open');dom.context.style.display='none'}
function makeButton(app,cls){let b=document.createElement('button');b.className=cls;b.dataset.app=app.id;b.title=app.name;b.setAttribute('aria-label','Abrir '+app.name);if(cls==='shortcut')b.innerHTML='<span class="sicon">'+app.icon+'</span><span>'+app.name+'</span>';else b.textContent=app.icon;b.addEventListener('click',()=>openApp(app.id));return b}
apps.forEach(a=>{dom.shortcuts.append(makeButton(a,'shortcut'));if(a.id!=='about')dom.dock.append(makeButton(a,'dock-btn'))});
$('#start').onclick=()=>{dom.menu.classList.toggle('open');dom.context.style.display='none'};
function renderMenu(){dom.menu.innerHTML='<div style="padding:8px 10px 12px;font-size:15px;font-weight:800">KG Desktop <span class="muted" style="font-weight:400;font-size:11px">v1.0</span></div>'+apps.map(a=>'<button class="startitem" data-app="'+a.id+'"><span style="font-size:19px">'+a.icon+'</span>'+a.name+'</button>').join('')+'<div class="hint" style="padding:10px">Ctrl/Cmd + K: menu · Esc: fechar</div>';dom.menu.querySelectorAll('[data-app]').forEach(b=>b.onclick=()=>openApp(b.dataset.app))}renderMenu();
function focusWin(id){const w=windows.get(id);if(!w)return;w.el.style.zIndex=++z;windows.forEach(x=>x.el.classList.remove('active'));w.el.classList.add('active');$('#activeLabel').textContent=w.app.name;lastFocus=id}
function fitWin(el){const width=dom.windows.clientWidth,height=dom.windows.clientHeight;let left=parseFloat(el.style.left),top=parseFloat(el.style.top);if(!Number.isFinite(left))left=0;if(!Number.isFinite(top))top=0;const w=el.offsetWidth,h=el.offsetHeight;el.style.left=Math.max(0,Math.min(left,Math.max(0,width-Math.min(w,120))))+'px';el.style.top=Math.max(0,Math.min(top,Math.max(0,height-Math.min(h,65))))+'px'}
function openApp(id,options={}){closeMenu();let app=apps.find(a=>a.id===id);if(!app)return;let key=(id==='editor'?'editor:'+String(options.name||'Novo documento'):id);if(windows.has(key)){let w=windows.get(key);w.el.style.display='flex';focusWin(key);return}const wrap=document.createElement('section');wrap.className='window active';wrap.setAttribute('role','dialog');wrap.setAttribute('aria-label',app.name);let dw=dom.windows.clientWidth,dh=dom.windows.clientHeight;let mobile=dw<690;let ww=mobile?Math.max(265,dw-20):Math.min(630,dw-45),hh=mobile?Math.max(250,dh-125):Math.min(445,dh-100);wrap.style.width=ww+'px';wrap.style.height=hh+'px';wrap.style.left=Math.max(0,(dw-ww)/2+((counter%4)-2)*13)+'px';wrap.style.top=Math.max(0,Math.min(dh-hh-15,24+(counter%5)*19))+'px';counter++;
wrap.innerHTML='<div class="titlebar"><div class="traffic"><button class="close" title="Fechar" aria-label="Fechar"></button><button class="min" title="Minimizar" aria-label="Minimizar"></button><button class="max" title="Maximizar" aria-label="Maximizar"></button></div><div class="windowtitle">'+app.icon+' '+safe(app.name)+'</div></div><div class="windowcontent"></div><div class="resize" title="Redimensionar"></div>';
dom.windows.append(wrap);windows.set(key,{el:wrap,app,options,max:false});focusWin(key);wrap.addEventListener('pointerdown',()=>focusWin(key));wrap.querySelector('.close').onclick=()=>{wrap.remove();windows.delete(key);updateDock();if(!windows.size)$('#activeLabel').textContent='Desktop'};wrap.querySelector('.min').onclick=()=>{wrap.style.display='none';updateDock()};wrap.querySelector('.max').onclick=()=>toggleMax(key);let title=wrap.querySelector('.titlebar');title.addEventListener('pointerdown',e=>{if(e.target.closest('button'))return;if(windows.get(key).max)return;dragStart(e,wrap,'move')});wrap.querySelector('.resize').addEventListener('pointerdown',e=>{if(windows.get(key).max)return;dragStart(e,wrap,'resize')});renderApp(id,wrap.querySelector('.windowcontent'),options,key);updateDock()}
function dragStart(e,el,type){if(e.button!==0&&e.pointerType==='mouse')return;e.preventDefault();let startX=e.clientX,startY=e.clientY,rect=el.getBoundingClientRect(),parent=dom.windows.getBoundingClientRect(),left=rect.left-parent.left,top=rect.top-parent.top,w=rect.width,h=rect.height;const target=e.currentTarget;target.setPointerCapture(e.pointerId);function move(ev){let dx=ev.clientX-startX,dy=ev.clientY-startY;if(type==='move'){el.style.left=Math.max(0,Math.min(left+dx,parent.width-80))+'px';el.style.top=Math.max(0,Math.min(top+dy,parent.height-50))+'px'}else{el.style.width=Math.min(parent.width-Math.max(0,left),Math.max(265,w+dx))+'px';el.style.height=Math.min(parent.height-Math.max(0,top),Math.max(190,h+dy))+'px'}}function up(){target.removeEventListener('pointermove',move);target.removeEventListener('pointerup',up);target.removeEventListener('pointercancel',up)}target.addEventListener('pointermove',move);target.addEventListener('pointerup',up);target.addEventListener('pointercancel',up)}
function toggleMax(key){let w=windows.get(key);if(!w)return;let el=w.el;const p=dom.windows;if(!w.max){w.original=[el.style.left,el.style.top,el.style.width,el.style.height];el.style.left='5px';el.style.top='5px';el.style.width=(p.clientWidth-10)+'px';el.style.height=(p.clientHeight-85)+'px';w.max=true}else{[el.style.left,el.style.top,el.style.width,el.style.height]=w.original;w.max=false}}
function updateDock(){dom.dock.querySelectorAll('button').forEach(b=>b.classList.toggle('running',[...windows.values()].some(w=>w.app.id===b.dataset.app)))}
function renderApp(id,c,opts,key){if(id==='files')renderFiles(c);if(id==='notes')renderNotes(c);if(id==='editor')renderEditor(c,opts,key);if(id==='calculator')renderCalc(c);if(id==='terminal')renderTerminal(c);if(id==='settings')renderSettings(c);if(id==='browser')renderBrowser(c);if(id==='about')renderAbout(c)}
function renderFiles(c) {
  c.innerHTML = '<div class="toolbar"><button class="btn primary" id="newfile">+ Novo texto</button><button class="btn" id="importfile">Importar .txt</button><input id="fileinput" type="file" accept=".txt,.md,text/plain,text/markdown" hidden><span class="hint">Armazenamento local</span></div><div id="filelist"></div>';
  const list = c.querySelector('#filelist');
  function refresh() {
    list.innerHTML = files.length ? files.map((f,i)=>'<div class="file-row"><span style="font-size:25px">📄</span><span class="name">'+safe(f.name)+'</span><button class="btn" data-open="'+i+'">Abrir</button><button class="btn" data-download="'+i+'" title="Exportar">↓</button><button class="btn" data-delete="'+i+'" title="Apagar">×</button></div>').join('') : '<div class="file-empty">Nenhum arquivo. Crie um texto para começar.</div>';
    list.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>openApp('editor',{name:files[+b.dataset.open].name}));
    list.querySelectorAll('[data-download]').forEach(b=>b.onclick=()=>{let f=files[+b.dataset.download];downloadText(f.name,f.content)});
    list.querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>{let i=+b.dataset.delete;if(confirm('Apagar '+files[i].name+'?')){files.splice(i,1);store.set('files',files);refresh()}});
  }
  c.querySelector('#newfile').onclick=()=>{let name=prompt('Nome do novo arquivo:','Documento.txt');if(!name)return;name=name.trim().slice(0,80);if(!name)return;if(files.some(f=>f.name===name))return toast('Já existe arquivo com esse nome.');files.push({name,content:''});store.set('files',files);refresh();openApp('editor',{name})};
  c.querySelector('#importfile').onclick=()=>c.querySelector('#fileinput').click();
  c.querySelector('#fileinput').onchange=async e=>{let file=e.target.files[0];if(!file)return;if(file.size>512000)return toast('Limite de importação: 500 KB.');let name=file.name;if(files.some(f=>f.name===name))name=Date.now()+'-'+name;files.push({name,content:await file.text()});if(store.set('files',files)){refresh();toast('Arquivo importado.')}else files.pop()};
  refresh();
}
function downloadText(name,content){let url=URL.createObjectURL(new Blob([content],{type:'text/plain;charset=utf-8'}));let a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function renderEditor(c,opts,key){let name=opts.name||'Novo documento';let find=()=>files.find(f=>f.name===name);c.innerHTML='<div class="editor"><div class="toolbar"><strong id="edname"></strong><button class="btn primary" id="save">Salvar</button><button class="btn" id="export">Exportar</button><span class="hint" id="status">Edite seu texto</span></div><textarea spellcheck="true" aria-label="Conteúdo do documento" placeholder="Comece a escrever..."></textarea></div>';c.querySelector('#edname').textContent=name;let area=c.querySelector('textarea');area.value=find()?.content||'';let status=c.querySelector('#status');function save(){let f=find();if(f)f.content=area.value;else files.push({name,content:area.value});if(store.set('files',files)){status.textContent='Salvo ✓';toast('Documento salvo.')}}c.querySelector('#save').onclick=save;c.querySelector('#export').onclick=()=>downloadText(name,area.value);let timer;area.addEventListener('input',()=>{status.textContent='Alterações não salvas';clearTimeout(timer);timer=setTimeout(save,1100)});area.addEventListener('keydown',e=>{if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='s'){e.preventDefault();save()}})}
function renderNotes(c){c.innerHTML='<textarea class="notes-area" spellcheck="true" aria-label="Notas" placeholder="Escreva suas notas..."></textarea>';let t=c.querySelector('textarea');t.value=notes;let timer;t.addEventListener('input',()=>{notes=t.value;clearTimeout(timer);timer=setTimeout(()=>store.set('notes',notes),300)})}
function renderCalc(c){c.innerHTML='<div class="calc"><div class="calc-display" id="display">0</div><div class="calc-buttons"></div></div>';let display=c.querySelector('#display');let expr='';const chars=['C','⌫','%','÷','7','8','9','×','4','5','6','−','1','2','3','+','±','0','.','='];const grid=c.querySelector('.calc-buttons');chars.forEach(ch=>{let b=document.createElement('button');b.textContent=ch;if('÷×−+='.includes(ch))b.className='op';b.onclick=()=>{if(ch==='C')expr='';else if(ch==='⌫')expr=expr.slice(0,-1);else if(ch==='±')expr=expr.startsWith('-')?expr.slice(1):'-'+expr;else if(ch==='='){try{let s=expr.replace(/×/g,'*').replace(/÷/g,'/').replace(/−/g,'-').replace(/(\d+(?:\.\d+)?)%/g,'($1/100)');if(!/^[\d\s()+*/.\-]+$/.test(s))throw Error();let result=Function('"use strict";return ('+s+')')();if(!Number.isFinite(result))throw Error();expr=String(+result.toPrecision(11))}catch{expr='Erro'}}else{if(expr==='Erro')expr='';expr+=ch}display.textContent=expr||'0'};grid.append(b)})}
function renderTerminal(c){c.innerHTML='<div class="terminal"><div class="term-output" aria-live="polite"></div><div class="term-line"><span>kg@iphone:~$</span><input class="term-input" aria-label="Comando" autocapitalize="off" autocomplete="off" spellcheck="false" /></div></div>';let out=c.querySelector('.term-output'),input=c.querySelector('input');function print(s){out.textContent+=s+'\n';out.scrollTop=out.scrollHeight}print('KG Shell v1.0 — ambiente simulado, sem acesso ao shell do iOS.\nDigite help para comandos.');input.addEventListener('keydown',e=>{if(e.key!=='Enter')return;let v=input.value.trim(),parts=v.split(/\s+/),cmd=(parts[0]||'').toLowerCase();input.value='';if(cmd==='clear'){out.textContent='';return}print('kg@iphone:~$ '+v);switch(cmd){case'help':print('Comandos: help, clear, date, ls, cat NOME, echo TEXTO, uname, whoami, open APP, theme N, about');break;case'date':print(new Date().toLocaleString('pt-BR'));break;case'ls':print(files.map(f=>f.name).join('   ')||'(vazio)');break;case'cat':{let f=files.find(f=>f.name===parts.slice(1).join(' '));print(f?f.content:'Arquivo não encontrado.');break}case'echo':print(parts.slice(1).join(' '));break;case'uname':print('KG Desktop Web / iOS Safari');break;case'whoami':print('usuario-local');break;case'open':{let a=apps.find(a=>a.id===parts[1]);a?(openApp(a.id),print('Abrindo '+a.name)):print('Aplicativo desconhecido.');break}case'theme':{let n=Number(parts[1]);if(Number.isInteger(n)&&n>=1&&n<=themes.length){theme=n-1;store.set('theme',theme);applyTheme();print('Tema: '+themes[theme].name)}else print('Use theme 1 até '+themes.length);break}case'about':print('KG Desktop v1.0 · navegador · arquivos locais no navegador.');break;case'':break;default:print('Comando não disponível. Digite help.')}})}
function renderSettings(c){c.innerHTML='<div class="panel"><h2 class="heading">Aparência</h2><p class="muted sub">Escolha o papel de parede do KG Desktop.</p><div class="swatches"></div><p class="hint" id="themeLabel"></p><hr style="border:0;border-top:1px solid var(--line);margin:24px 0"><h3>Preferências</h3><p class="info muted">Janelas podem ser movidas pelo título e redimensionadas pelo canto inferior direito. No iPhone, use o toque; com teclado e mouse conectados, utilize o cursor do AssistiveTouch.</p><button class="btn" id="restore">Restaurar papel de parede</button></div>';const sw=c.querySelector('.swatches');function render(){sw.innerHTML='';themes.forEach((t,i)=>{let b=document.createElement('button');b.className='swatch'+(theme===i?' selected':'');b.style.background=t.css;b.title=t.name;b.setAttribute('aria-label',t.name);b.onclick=()=>{theme=i;store.set('theme',theme);applyTheme();render()};sw.append(b)});c.querySelector('#themeLabel').textContent='Atual: '+themes[theme].name}c.querySelector('#restore').onclick=()=>{theme=0;store.set('theme',theme);applyTheme();render()};render()}
function renderBrowser(c){c.innerHTML='<div class="panel"><h2 class="heading">Abrir na web</h2><p class="muted sub">No iPhone, sites externos abrem no Safari. O iOS limita a integração entre aplicativos.</p><form id="webform" style="display:flex;gap:7px;margin:18px 0"><input id="url" type="url" placeholder="https://exemplo.com" required style="flex:1"><button class="btn primary">Abrir</button></form><div class="tilegrid"><button class="tile" data-url="https://www.google.com"><span class="emoji">🔎</span>Google</button><button class="tile" data-url="https://www.youtube.com"><span class="emoji">▶️</span>YouTube</button><button class="tile" data-url="https://github.com"><span class="emoji">🐙</span>GitHub</button></div></div>';function external(url){try{const u=new URL(url);if(!['http:','https:'].includes(u.protocol))throw Error();window.open(u.href,'_blank','noopener,noreferrer')}catch{toast('Use um endereço https:// válido.')}}c.querySelector('form').onsubmit=e=>{e.preventDefault();external(c.querySelector('#url').value)};c.querySelectorAll('[data-url]').forEach(b=>b.onclick=()=>external(b.dataset.url))}
function renderAbout(c){c.innerHTML='<div class="panel"><h1 class="heading">KG Desktop <span style="color:var(--accent)">1.0</span></h1><p class="muted">Experiência de desktop para Safari no iPhone 13.</p><div class="tilegrid"><div class="tile"><span class="emoji">🪟</span>Multijanelas</div><div class="tile"><span class="emoji">🖱️</span>Mouse / toque</div><div class="tile"><span class="emoji">⌨️</span>Teclado</div><div class="tile"><span class="emoji">📁</span>Arquivos locais</div></div><p class="info muted" style="margin-top:23px"><b style="color:white">Limites reais:</b> este projeto roda dentro do navegador, não substitui a tela inicial do iOS, não pode controlar aplicativos de terceiros nem transformar o iPhone em Samsung DeX. Para HDMI é necessário um adaptador de vídeo Lightning compatível. Em monitor externo, o sistema pode apenas espelhar a tela.</p><p class="hint">Dados e documentos são salvos no armazenamento local do navegador. Faça exportação dos arquivos importantes.</p></div>'}
function updateClock(){let d=new Date();$('#clock').textContent=d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});$('#clock').title=d.toLocaleDateString('pt-BR',{dateStyle:'full'})}updateClock();setInterval(updateClock,15000);
window.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();dom.menu.classList.toggle('open')}else if(e.key==='Escape'){closeMenu()}else if((e.ctrlKey||e.metaKey)&&e.altKey&&e.key.toLowerCase()==='n'){e.preventDefault();openApp('notes')}});
dom.desktop.addEventListener('pointerdown',e=>{if(!e.target.closest('#startmenu,#start,#context'))closeMenu()});dom.desktop.addEventListener('contextmenu',e=>{if(e.target.closest('.window'))return;e.preventDefault();dom.context.innerHTML='<button data-action="notes">Nova nota</button><button data-action="files">Abrir arquivos</button><button data-action="settings">Personalizar</button>';dom.context.style.display='block';dom.context.style.left=Math.min(e.clientX,innerWidth-180)+'px';dom.context.style.top=Math.min(e.clientY,innerHeight-140)+'px';dom.context.querySelectorAll('button').forEach(b=>b.onclick=()=>openApp(b.dataset.action))});window.addEventListener('resize',()=>{windows.forEach((w,key)=>{if(w.max){w.max=false;toggleMax(key)}else fitWin(w.el)})});
if('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('./sw.js').catch(()=>{});
openApp('about');
})();
